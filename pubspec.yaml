name: invoice_manager
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  yaml: ^3.1.2
  intl: ^0.20.2
  pdf: ^3.11.0
  path_provider: ^2.1.3
  file_saver: ^0.4.0
  file_picker: ^12.2.0
  markdown: ^7.1.0
  flutter_markdown: ^0.7.5
  collection: ^1.19.1
  drift: ^2.19.0
  path: ^1.9.0
  archive: ^3.4.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.19.0
  lint: ^2.3.0
  build_runner: ^2.4.8
  github_pages: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icons/

  # Bundle Roboto so the web build doesn't fetch it from fonts.gstatic.com
  # at runtime (required for offline/PWA use).
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-BoldItalic.ttf
          weight: 700
          style: italic
